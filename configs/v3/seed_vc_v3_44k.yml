# Seed-VC v3.0 - quality preset
# 44.1 kHz / 128-band / hop 256 (BigVGAN-v2 44k 256x), Whisper-large-v3-turbo encoder,
# BSQ content bottleneck (trained with CTC ASR loss), streaming-capable DiT.
# DiT dimensions mirror the v1 44k SVC model so its weights warm-start this preset
# (train_v3.py --init-from-v1). No released checkpoint matches this config yet.
version: "3.0"
log_dir: "./runs"

preprocess_params:
  sr: 44100
  spect_params:
    n_fft: 1024
    win_length: 1024
    hop_length: 256
    n_mels: 128
    fmin: 0
    fmax: null

model_params:
  dit_type: "DiT"
  reg_loss_type: "l1"

  content_encoder:
    type: "whisper"
    name: "openai/whisper-large-v3-turbo"
    output_layer: null      # null = all 32 layers + final layer norm (HF last_hidden_state)
    pad_seconds: 30         # Whisper's native 30 s regime; must match between training and inference

  bottleneck:
    enabled: true
    dim: 512
    intermediate_dim: 1536
    num_blocks: 6
    kernel_size: 7
    lookahead: 0            # causal: index t depends only on encoder frames <= t
    codebook_size: 2048     # 11 bits per 50 Hz frame (550 bps); smaller = less timbre leakage
    entropy_inv_temperature: 10.0
    entropy_gamma: 1.0
    asr_tokenizer: "byte"   # byte (257-way CTC) | whisper (BPE, ~51.9k-way CTC)
    asr_blocks: 2
    recon_blocks: 4

  length_regulator:
    channels: 768
    sampling_ratios: [1, 1, 1, 1]
    norm: "frame"           # frame-local LayerNorm (v1 used GroupNorm over the whole sequence)
    f0_condition: false     # true for singing (adds RMVPE)
    n_f0_bins: 256

  style_encoder:
    dim: 192
    campplus_path: "campplus_cn_common.bin"

  vocoder:
    type: "bigvgan"
    name: "nvidia/bigvgan_v2_44khz_128band_256x"
    use_cuda_kernel: false

  DiT:
    hidden_dim: 768
    num_heads: 12
    depth: 17
    class_dropout_prob: 0.1
    block_size: 8192
    in_channels: 128
    style_condition: true
    final_layer_type: "mlp"   # mlp keeps the cached streaming path exact
    target: "mel"
    content_dim: 768
    content_codebook_size: 1024
    content_type: "discrete"
    f0_condition: false
    n_f0_bins: 256
    content_codebooks: 1
    is_causal: false
    long_skip_connection: false
    zero_prompt_speech_token: false
    time_as_token: false
    style_as_token: false
    uvit_skip_connection: true
    add_resblock_in_transformer: false

  cfm:
    attn_mode_probs: {full: 0.5, prompt_isolated: 0.5}
    crop_prob: 0.3
    crop_min_frames: 32       # ~0.19 s
    crop_max_frames: 344      # ~2 s

loss_params:
  base_lr: 0.0001
  lambda_ctc: 1.0
  lambda_recon: 1.0
  lambda_entropy: 0.1

training:
  batch_size: 4
  min_duration: 1.0
  max_duration: 20.0
  perturb: "openvoice"      # openvoice (v1 timbre perturbation) | none

inference:
  diffusion_steps: 25
  inference_cfg_rate: 0.7
  sway_coef: -1.0           # null = uniform Euler grid (v1); -1 = sway sampling (v2)
  attn_mode: "full"
  max_prompt_seconds: 25.0

streaming:
  block_time: 0.18
  crossfade_time: 0.04
  ce_left_context: 3.0      # free with pad_seconds=30 (the encoder always runs 30 s)
  dit_left_context: 0.5
  right_context: 0.04
  diffusion_steps: 10
  cfg_rate: 0.7
  sway_coef: -1.0
  prompt_max_time: 3.0
  vocoder_pad_frames: 16      # measured: 8 frames -> 4.2% edge error, 16 -> 0.12% (tools/v3_dry_run.py)
  precision: "fp32"               # fp32 | fp16 | bf16 autocast for the DiT; fp16 needs a GPU, bf16 also works on CPU
